name: Compile Release Candidate

on:
  workflow_dispatch:

# Cap the PlatformIO Core version the platform's penv bootstrap may install
# (see .github/pio-constraints.txt). UV_CONSTRAINT reaches the penv's uv pip
# install; PIP_CONSTRAINT covers the pip fallback path.
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release_rc
            asset: firmware.bin
          - pio_env: sticky-gh_release_rc
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release_rc
            asset: firmware-x4pro.bin
          - pio_env: x4c-gh_release_rc
            asset: firmware-x4c.bin
          - pio_env: papermono-gh_release_rc
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-v3-${{ runner.os }}-${{ matrix.pio_env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig (gh_release_rc, sticky-gh_release_rc) run a nested
          # `pio run` from ~/.platformio/penv. The platform bootstraps that penv with an
          # open-ended "pioarduino>=6.1.19", which drifts upward independently of the
          # outer core; a penv core whose tool-scons pin disagrees with the platform's
          # makes them reinstall over each other until the running SCons loses its
          # package mid-build ("No module named 'SCons.Tool.FortranCommon'"). The
          # pio-constraints.txt floor does not cap upward drift, so pin explicitly.
          # Keep the penv core on the same 6.2.0 version as the outer core
          # installed above (the develop platform needs 6.2.0 / SCons 4.11.1).
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.pio_env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.2.0"
          ~/.platformio/penv/bin/pio --version

      - name: Extract env
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BRANCH_SUFFIX=${GITHUB_REF_NAME#release/}" >> $GITHUB_ENV

      - name: Build CrossPoint Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}-${{ matrix.pio_env }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin
