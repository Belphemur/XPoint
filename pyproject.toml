[project]
name = "crosspoint-tools"
version = "0.1.0"
description = "Host-side tooling for CrossPoint Reader (serial monitor with memory graph, asset generators, i18n)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.2.0",
    "cairosvg>=2.9.0",
    "matplotlib>=3.6",
    "pyserial>=3.5",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
graph = [
    "PyQt6>=6.6",
]

[tool.uv]
package = false